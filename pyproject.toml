[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitter"
version = "0.5.0"
description = "Splitter — personal VelociDrone lap timer: gate-by-gate splits, telemetry and analysis"
requires-python = ">=3.11"
dependencies = [
    "velocidrone-ws",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    # SQLAlchemy's async engine needs greenlet but only declares it for x86_64/aarch64
    # machine names — Apple Silicon reports "arm64" and gets nothing. Say it outright.
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
]

[project.optional-dependencies]
# The online track picker. Private package; see README "What is not in this repo".
tracks = ["velocidrone-tracks"]

[project.scripts]
splitter = "splitter.manage:main"
splitter-sidecar = "splitter.desktop_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splitter"]
# The build stamp is gitignored (generated by scripts/stamp.py); hatch would drop it.
artifacts = ["src/splitter/_stamp.py"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.8",
    "ruff>=0.3",
]
pre-install-commands = [
    "pip install -e libs/velocidrone-ws",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check src tests"
typecheck = "mypy src"
format = "ruff format src tests"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
# Optional online track client (private packages, not in this repo).
module = ["velocidrone_tracks", "velocidrone_tracks.*", "velocidrone_api", "velocidrone_api.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated at build time by scripts/stamp.py; absent in a checkout.
module = ["splitter._stamp"]
ignore_missing_imports = true
