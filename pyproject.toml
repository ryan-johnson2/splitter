[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitter"
version = "0.1.0"
description = "Splitter — personal VelociDrone lap timer: gate-by-gate splits, telemetry and analysis"
requires-python = ">=3.11"
dependencies = [
    "velocidrone-ws",
    "velocidrone-api",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
]

[project.scripts]
splitter = "splitter.manage:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splitter"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.8",
    "ruff>=0.3",
]
pre-install-commands = [
    "pip install -e ../velocidrone-libraries/velocidrone-websocket",
    "pip install -e ../velocidrone-libraries/velocidrone-api",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check src tests"
typecheck = "mypy src"
format = "ruff format src tests"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
