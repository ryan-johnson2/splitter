[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velocidrone-ws"
version = "0.1.0"
description = "Python client library for VelociDrone's local WebSocket server"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/velocidrone_ws"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check src tests"
typecheck = "mypy src"
format = "ruff format src tests"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
